<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-Fabrik – 3D-Spike</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f5;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1b2430; }
    #view { position: absolute; inset: 0; }
    .panel { position: absolute; background: rgba(255, 255, 255, 0.92); border: 1px solid #c9d1db;
      border-radius: 6px; padding: 8px 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    #hud { top: 10px; left: 10px; min-width: 230px; }
    #hud table { border-collapse: collapse; }
    #hud td { padding: 1px 6px 1px 0; white-space: nowrap; }
    #hud td:first-child { color: #5b6675; }
    #hud .on { color: #c0392b; font-weight: 600; }
    #hud .ok { color: #27ae60; font-weight: 600; }
    #hud h1 { font-size: 14px; margin: 0 0 4px; }
    #hud .small { font-size: 11px; color: #5b6675; }
    #keys { top: 10px; right: 10px; max-width: 250px; }
    #keys button { display: flex; width: 100%; justify-content: space-between; gap: 8px; margin: 2px 0;
      padding: 3px 6px; border: 1px solid #c9d1db; border-radius: 4px; background: #f7f9fb; cursor: pointer;
      font: inherit; color: inherit; text-align: left; }
    #keys button:hover { background: #e8eef5; }
    #keys kbd { font: 11px ui-monospace, Menlo, monospace; background: #1b2430; color: #fff; border-radius: 3px;
      padding: 0 5px; min-width: 14px; text-align: center; }
    #out { bottom: 10px; left: 10px; right: 10px; max-height: 45%; overflow: auto; display: none;
      font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre; margin: 0; }
    #error { top: 30%; left: 50%; transform: translateX(-50%); max-width: 560px; display: none;
      border-color: #c0392b; color: #c0392b; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="view"></div>

  <div id="hud" class="panel">
    <h1>3D-Spike: Rapier + Three.js</h1>
    <table>
      <tr><td>Transportfläche</td><td id="h-method">–</td></tr>
      <tr><td>FPS</td><td id="h-fps">–</td></tr>
      <tr><td>Physik pro Schritt</td><td id="h-phys">–</td></tr>
      <tr><td>Simulationszeit</td><td id="h-time">–</td></tr>
      <tr><td>Kisten</td><td id="h-boxes">–</td></tr>
      <tr><td>Sensor</td><td id="h-sensor">–</td></tr>
      <tr><td>Senke 1 (Rutsche)</td><td id="h-sink1">–</td></tr>
      <tr><td>Senke 2 (Schieber)</td><td id="h-sink2">–</td></tr>
      <tr><td>Schieber / Stopper</td><td id="h-act">–</td></tr>
      <tr><td>Erzeuger / Bänder</td><td id="h-gen">–</td></tr>
    </table>
    <div class="small" id="h-load">Lade …</div>
  </div>

  <div id="keys" class="panel">
    <button data-key="a"><span>Schieber aus/ein</span><kbd>A</kbd></button>
    <button data-key="t"><span>Stopper ein/aus</span><kbd>T</kbd></button>
    <button data-key="m"><span>Transportflächen-Methode</span><kbd>M</kbd></button>
    <button data-key="b"><span>Bänder an/aus</span><kbd>B</kbd></button>
    <button data-key="e"><span>Erzeuger an/aus</span><kbd>E</kbd></button>
    <button data-key="s"><span>Kiste schräg (30°) auflegen</span><kbd>S</kbd></button>
    <button data-key="p"><span>+200 Kisten</span><kbd>P</kbd></button>
    <button data-key=" "><span>Pause / weiter</span><kbd>␣</kbd></button>
    <button data-key="r"><span>Zurücksetzen</span><kbd>R</kbd></button>
    <button data-key="d"><span>Determinismus-Lauf (30 s)</span><kbd>D</kbd></button>
    <button data-key="x"><span>Alle Messungen</span><kbd>X</kbd></button>
  </div>

  <pre id="out" class="panel"></pre>
  <div id="error" class="panel"></div>

  <!-- Ladezeiten der Bibliotheken messen (Zeit zwischen den Skript-Tags) -->
  <script>window.SPIKE_T = { start: performance.now() };</script>
  <script src="lib/rapier.js"></script>
  <script>SPIKE_T.rapier = performance.now();</script>
  <script src="lib/three.js"></script>
  <script>SPIKE_T.three = performance.now();</script>
  <script src="sim/clock.js"></script>
  <script src="spike/scene.js"></script>
  <script src="spike/measure.js"></script>
  <script src="spike/spike.js"></script>
</body>
</html>
